# Netlify — build do Vite + Functions (proxy do Mubi e config no Blobs).
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# SPA — todas as rotas caem no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
