# Netlify — build do Vite + Functions (proxy do Mubi e config no Blobs).
[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Atualiza o cache do Mubisys no Blobs a cada 20 minutos (modo incremental).
[functions."mubi-cache-cron"]
  schedule = "*/20 * * * *"

# Recarga completa de madrugada (06:00 UTC = 03:00 de Brasilia), quando o
# Mubisys responde rapido.
[functions."mubi-cache-noturno"]
  schedule = "0 6 * * *"

# Fluxo realizado mes a mes (contas pagas do ano corrente e anterior). Pesado,
# roda 1x/dia as 04:30 UTC (01:30 de Brasilia).
[functions."mubi-realizado-cron"]
  schedule = "30 4 * * *"

[dev]
  command = "npm run dev"
  targetPort = 5173
  framework = "#custom"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# SPA — todas as rotas caem no index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
