name: Cache do Mubisys

# Substitui os crons do Netlify (mubi-cache-cron a cada 20 min e
# mubi-cache-noturno as 06:00 UTC).
#
# POR QUE AQUI E NAO NO SUPABASE: a carga leva MINUTOS -- o Mubisys responde em
# 25-40s por pagina. Edge Function morre em 150s. O Actions nao tem esse limite.
#
# O job NAO recebe a chave-mestra do banco: ele manda o resultado pronto para a
# Edge Function painel-cache, que grava. O unico segredo aqui autoriza escrever
# CACHE, que e descartavel e se reconstroi sozinho.
# schedule re-registrado em 2026-07-31 22h25 UTC: o primeiro disparo agendado
# nao veio em 90 min; regravar o arquivo na main forca o GitHub a re-registrar.
on:
  schedule:
    # A cada 20 minutos: recarga leve (recebiveis, pagar, bancos + janela de 7
    # dias de orcamentos/OS mesclada).
    - cron: "*/20 * * * *"
    # 06:00 UTC = 03:00 de Brasilia: recarga completa, quando o ERP esta livre.
    - cron: "0 6 * * *"
    # 07:00 UTC: o fluxo REALIZADO mes a mes, em corrida separada. Depois da
    # completa (que leva ~25 min) e nao junto dela: somadas encostariam no teto
    # de 45 min do job. O historico mensal muda pouco; uma vez por dia basta.
    - cron: "0 7 * * *"
    # 08:00 UTC de DOMINGO: o historico de O.S. da tela de Permutas. Semanal
    # porque o passado nao muda -- a carga normal ja mantem o recente em dia.
    # Corrida propria pelo mesmo motivo das outras: sao ~30 paginas de 25-40s.
    - cron: "0 8 * * 0"
  workflow_dispatch:
    inputs:
      completo:
        description: "Rodar carga completa (o ano inteiro)"
        type: boolean
        default: false
      realizado:
        description: "Rodar so o fluxo realizado mes a mes"
        type: boolean
        default: false
      historico:
        description: "Puxar o HISTORICO de O.S. (para a busca da tela de Permutas)"
        type: boolean
        default: false
      historicoDesde:
        description: "Historico a partir de (AAAA-MM-DD). Vazio = o que estiver na tela de Permutas"
        type: string
        default: ""

concurrency:
  # Uma carga por vez. Duas simultaneas so castigam a API do Mubisys e podem
  # gravar uma por cima da outra.
  group: cache-mubisys
  cancel-in-progress: false

jobs:
  carregar:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci

      # `node --check` valida sintaxe e nada mais: um import de nome que o
      # modulo nao exporta passa verde e so explode com as chaves, no meio da
      # corrida. Foi assim que a primeira carga do historico morreu depois de
      # 89 s de ERP. Isto roda em segundos e falha antes de gastar a API.
      - name: Conferir que os imports resolvem
        run: node scripts/conferir-imports.mjs

      - name: Carregar
        env:
          PAINEL_TOKEN: ${{ secrets.PAINEL_TOKEN }}
          MUBI_BASE_URL: ${{ secrets.MUBI_BASE_URL }}
          MUBI_PUBLIC_KEY: ${{ secrets.MUBI_PUBLIC_KEY }}
          MUBI_TOKEN: ${{ secrets.MUBI_TOKEN }}
          HISTORICO_DESDE: ${{ inputs.historicoDesde }}
        run: |
          # O cron das 07:00 (e o botao "realizado") fazem SO o fluxo mes a mes.
          # O cron das 06:00 e o botao "completo" fazem a carga do ano.
          # Qualquer outro disparo e a recarga leve.
          if [ "${{ github.event.schedule }}" = "0 8 * * 0" ] || [ "${{ inputs.historico }}" = "true" ]; then
            node scripts/carregar-cache.mjs --historico
          elif [ "${{ github.event.schedule }}" = "0 7 * * *" ] || [ "${{ inputs.realizado }}" = "true" ]; then
            node scripts/carregar-cache.mjs --realizado
          elif [ "${{ github.event.schedule }}" = "0 6 * * *" ] || [ "${{ inputs.completo }}" = "true" ]; then
            node scripts/carregar-cache.mjs --completo
          else
            node scripts/carregar-cache.mjs
          fi
