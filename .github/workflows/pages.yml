name: Painel no GitHub Pages

# VIRADA FEITA: publica da main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # As regras dos hooks do React. O build NAO enxerga hook depois de return
      # -- e foi assim que uma tela branca subiu para producao com o job verde.
      # Roda antes do build para o deploy nem comecar quando quebra.
      - run: npm run lint
      # Um 404 intermitente do ERP nao pode virar cache vazio gravado como
      # sucesso. Roda em segundos, com fetch falso -- nao toca no Mubisys.
      - run: node scripts/conferir-404.mjs
      # O realizado tem de somar por PARCELA: o campo do topo perde as parcelas
      # e as vezes vem zerado. Grafico congelado nao da erro, so para de andar.
      - run: node scripts/conferir-realizado.mjs
      - run: npm run build
        env:
          # No Pages o site vive em /painel-impresilk/. O vite.config le isto;
          # o build do Netlify (sem a variavel) segue na raiz.
          BASE_PATH: /painel-impresilk/
      # SPA com BrowserRouter: refresh em rota interna vira 404 no Pages. O
      # 404.html com o proprio app faz qualquer caminho carregar o painel.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
