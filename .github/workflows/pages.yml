name: Painel no GitHub Pages

# VIRADA FEITA: publica da main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # A LISTA DE MODULOS DO PAINEL VIVE EM TRES ARQUIVOS, e um deles esta em
      # OUTRO repositorio (vida-leo/equipe-auth). Sem esta copia, o verificador
      # abaixo nao consegue ler a terceira lista.
      - uses: actions/checkout@v4
        with:
          repository: leogpereira-afk/vida-leo
          path: .externo/vida-leo
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # As regras dos hooks do React. O build NAO enxerga hook depois de return
      # -- e foi assim que uma tela branca subiu para producao com o job verde.
      # Roda antes do build para o deploy nem comecar quando quebra.
      - run: npm run lint
      # Um 404 intermitente do ERP nao pode virar cache vazio gravado como
      # sucesso. Roda em segundos, com fetch falso -- nao toca no Mubisys.
      - run: node scripts/conferir-404.mjs
      # O realizado tem de somar por PARCELA: o campo do topo perde as parcelas
      # e as vezes vem zerado. Grafico congelado nao da erro, so para de andar.
      - run: node scripts/conferir-realizado.mjs
      # MODULO NOVO TEM DE ENTRAR NAS TRES LISTAS. Quando falta numa, salvar a
      # permissao passa pelo filtro `permissoes.filter(p => LISTA.includes(p))`,
      # que descarta o desconhecido SEM ERRO: a direcao marca a caixa, ve a
      # caixa marcada, e a pessoa nao ganha acesso nenhum.
      #
      # Aconteceu com `permutas` (dois dias de caca ao defeito na tela errada) e
      # de novo com `campanhas` -- nas duas vezes este script ja existia, ja
      # acusava em uma linha e ja saia com codigo 1. So que ninguem o chamava, e
      # "lembrar de rodar" nunca foi defesa. Agora ele bloqueia o deploy.
      # OS 138 TESTES DE CALCULO. Rodam em ~100ms e nunca eram chamados: nao
      # havia script "test" e a CI nao os conhecia -- regressao na conta da
      # permuta subia com o job verde. TZ=UTC porque teste que so passa no fuso
      # da maquina do Leo ja deixou a CI do RH vermelha por 3 commits.
      - run: npm test
      - name: As tres listas de modulos batem?
        run: node scripts/conferir-sistemas.mjs
        env:
          # O script procura o equipe-auth em ~/Projetos/vida-leo quando roda na
          # maquina do Leo; na CI ele vem do checkout acima.
          VIDA_LEO: ${{ github.workspace }}/.externo/vida-leo
      - run: npm run build
        env:
          # No Pages o site vive em /painel-impresilk/. O vite.config le isto;
          # o build do Netlify (sem a variavel) segue na raiz.
          BASE_PATH: /painel-impresilk/
      # SPA com BrowserRouter: refresh em rota interna vira 404 no Pages. O
      # 404.html com o proprio app faz qualquer caminho carregar o painel.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
